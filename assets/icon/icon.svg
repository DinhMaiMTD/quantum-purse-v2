<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
<defs>
<linearGradient id="chip" x1="0" y1="0" x2="0.7" y2="1"><stop offset="0" stop-color="#77e4f2"/><stop offset="0.5" stop-color="#1cb4cc"/><stop offset="1" stop-color="#0b5e75"/></linearGradient>
<!-- The qp∞ mark, cut out of the tile. Geometry is in stroke-width units around the
     crossing point; draw_qp_mark in crates/qpv2-gui/src/ui/main_stages.rs uses the same numbers. -->
<mask id="cut8">
<rect x="88" y="88" width="848" height="848" rx="188" fill="white"/>
<g transform="translate(512 470.64) scale(60)">
<!-- Infinity: two 270° rings centred at x=±3 joined by the diagonals of a 3×3 square. -->
<path d="M-1.5 -1.5 A2.12132 2.12132 0 1 0 -1.5 1.5 L1.5 -1.5 A2.12132 2.12132 0 1 1 1.5 1.5 Z" fill="none" stroke="black" stroke-width="1"/>
<!-- q and p stems, 0.39 apart; each ends hidden inside a diagonal. -->
<rect x="-1.195" y="-2.62132" width="1" height="1.92632" fill="black"/>
<rect x="0.195" y="-2.62132" width="1" height="1.92632" fill="black"/>
<rect x="-1.195" y="0.695" width="1" height="3.305" fill="black"/>
<rect x="0.195" y="0.695" width="1" height="3.305" fill="black"/>
<!-- Weave: the "\" diagonal passes over the "/" diagonal and the stems behind it. -->
<polygon points="0,-0.70711 1.195,0.48789 1.195,0.09789 0,-1.09711" fill="white"/>
<polygon points="0,0.70711 -1.195,-0.48789 -1.195,-0.09789 0,1.09711" fill="white"/>
<line x1="-1.5" y1="-1.5" x2="1.5" y2="1.5" stroke="black" stroke-width="1"/>
</g>
</mask>
</defs>
<rect x="88" y="88" width="848" height="848" rx="188" fill="url(#chip)" mask="url(#cut8)"/>
</svg>
